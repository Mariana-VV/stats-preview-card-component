<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Stats Preview Card</title>
  </head>
  <body>
    <main>
      <div class="block">
        <div class="box">
          <picture class="picture">
            <source
              media="(min-width:768px)"
              srcset="images/image-header-desktop.jpg"
            />
            <img src="images/mob.png" alt="Business team" />
          </picture>
        </div>
        <div class="box">
          <h1 class="title">
            Get <span class="heightlight">insights</span> that help your
            business grow.
          </h1>
          <p class="description">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
          <ul class="list">
            <li class="item">
              <span class="digit">10k+</span>
              <span class="text">Companies</span>
            </li>
            <li class="item">
              <span class="digit">314</span>
              <span class="text">Templates</span>
            </li>
            <li class="item">
              <span class="digit">12M</span>
              <span class="text">Queries</span>
            </li>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
