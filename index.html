<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>stats-preview-card-component</title>
  </head>
  <body>
    <div class="block">
      <div class="box"></div>
      <div class="box">
        <h1 class="title">
          Get <span class="heightlight">insights</span> that help your business
          grow.
        </h1>
        <p class="description">
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </p>
        <ul class="list">
          <li class="item">
            <p class="digit">10k+</p>
            <p class="text">Companies</p>
          </li>
          <li class="item">
            <p class="digit">314</p>
            <p class="text">Templates</p>
          </li>
          <li class="item">
            <p class="digit">12M</p>
            <p class="text">Queries</p>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
